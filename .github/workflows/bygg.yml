name: Bygg motoren

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bygg.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bygg-${{ github.ref }}

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Stemple versjon
        id: stempel
        run: |
          kort="${GITHUB_SHA::7}"
          naa="$(date -u +%Y-%m-%dT%H:%MZ)"
          if ! grep -q '__VERSJON__' src/motor.ts; then
            echo "Fant ikke plassholderen __VERSJON__ i src/motor.ts." >&2
            echo "Den skal staa i 'export const VERSJON'. Uten den blir" >&2
            echo "bundlen publisert ustemplet, og da er versjonen loegn." >&2
            exit 1
          fi
          sed -i "s/__VERSJON__/$kort $naa/" src/motor.ts
          echo "versjon=$kort $naa" >> "$GITHUB_OUTPUT"
          echo "Stemplet som \`$kort $naa\`" >> "$GITHUB_STEP_SUMMARY"
          grep -n 'export const VERSJON' src/motor.ts

      - name: Bygg bundlen
        run: |
          npx esbuild src/motor.ts \
            --bundle \
            --format=esm \
            --platform=browser \
            --minify \
            --outfile=ny-signhub-motor.js

      - name: Sammenlign med fila i rot
        id: sammenlign
        run: |
          # Versjonsstempelet gjoer at md5 endrer seg ved hvert bygg. For a
          # avgjore om koden faktisk er endret, sammenlignes filene med
          # stempelet nullet ut. Raa md5 rapporteres i tillegg, for sporing.
          blind() {
            sed -E -e 's/[0-9a-f]{7} [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z/__V__/g' \
                   -e 's/__VERSJON__/__V__/g' "$1" \
              | md5sum | cut -d' ' -f1
          }
          ny=$(md5sum ny-signhub-motor.js | cut -d' ' -f1)
          na=$(md5sum signhub-motor.js    | cut -d' ' -f1)
          nyb=$(blind ny-signhub-motor.js)
          nab=$(blind signhub-motor.js)
          echo "ny=$ny" >> "$GITHUB_OUTPUT"
          {
            echo "| | byte | md5 | md5 uten stempel |"
            echo "| --- | ---: | --- | --- |"
            echo "| bygget fra src/ | $(stat -c%s ny-signhub-motor.js) | \`$ny\` | \`$nyb\` |"
            echo "| i rot na        | $(stat -c%s signhub-motor.js)    | \`$na\` | \`$nab\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$nyb" = "$nab" ]; then
            echo "endret=nei" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Koden i rot er allerede lik bygget; bare stempelet skiller. Ingenting a gjore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "endret=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Bytt inn og commit
        if: steps.sammenlign.outputs.endret == 'ja' && vars.AUTOBYGG == 'ja'
        run: |
          # Arkivnavnet tar med stempelet til fila som byttes ut. Bare dato
          # holdt ikke: ved andre publisering samme dag fantes filnavnet
          # allerede, og da ble den forrige versjonen ikke arkivert i det
          # hele tatt. Det er nettopp da man trenger den.
          dato=$(date -u +%Y-%m-%d)
          gammel=$(grep -o -E '"[0-9a-f]{7} [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z"' \
                     signhub-motor.js | head -1 | cut -c2-8)
          arkiv="versjoner/signhub-motor-$dato${gammel:+-$gammel}.js"
          if [ ! -e "$arkiv" ]; then
            cp signhub-motor.js "$arkiv"
            echo "Arkiverte forrige bundle som \`$arkiv\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\`$arkiv\` finnes fra for, arkiverte ikke pa nytt" >> "$GITHUB_STEP_SUMMARY"
          fi
          # cp, ikke mv: upload-artifact lenger ned leser ny-signhub-motor.js.
          cp ny-signhub-motor.js signhub-motor.js
          # src/motor.ts er stemplet i arbeidstreet her, men stages aldri.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signhub-motor.js versjoner/
          git commit -m "Bygg motoren ${{ steps.stempel.outputs.versjon }} [skip ci]"
          git push
          echo "Publiserte ny bundle. GitHub Pages bygger pa nytt." >> "$GITHUB_STEP_SUMMARY"

      - name: Rapporter at innbyttet star av
        if: steps.sammenlign.outputs.endret == 'ja' && vars.AUTOBYGG != 'ja'
        run: |
          {
            echo ""
            echo "Bygget avviker fra fila i rot, men **AUTOBYGG er ikke satt til \`ja\`**,"
            echo "sa \`signhub-motor.js\` er ikke rort. Sett variabelen under"
            echo "Settings -> Secrets and variables -> Actions -> Variables"
            echo "for a la denne workflowen publisere bundlen selv."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.sammenlign.outputs.endret == 'ja'
        with:
          name: signhub-motor-${{ steps.sammenlign.outputs.ny }}
          path: ny-signhub-motor.js
